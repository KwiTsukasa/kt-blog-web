<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 988 120" width="329.333" height="40" role="img" aria-label="KwiTsukasa" style="overflow:visible;user-select:none;filter:drop-shadow(0 0 5px rgba(236,120,139,.8))">
  <title>KwiTsukasa</title>
  <defs>
    <style>
      @keyframes kt-blog-wordmark-dash { from { stroke-dashoffset:calc(var(--len) + 1px); } to { stroke-dashoffset:0; } }
      @keyframes kt-blog-wordmark-weight { from { stroke-width:3px; } to { stroke-width:12px; } }
      @keyframes kt-blog-wordmark-fade { from { opacity:0; } to { opacity:1; } }
      @keyframes kt-blog-wordmark-dot { from { r:0; } to { r:7.5px; } }
      .kt-blog-wordmark-stroke {
        fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-width:3px;
        stroke-dasharray:calc(var(--len) + 1px);stroke-dashoffset:calc(var(--len) + 1px);opacity:0;
        animation:kt-blog-wordmark-dash 1s cubic-bezier(.8,0,.2,1) var(--delay) forwards,
          kt-blog-wordmark-weight 1s cubic-bezier(.8,0,.2,1) calc(var(--delay) + .5s) forwards,
          kt-blog-wordmark-fade .2s linear var(--delay) forwards;
      }
      .kt-blog-wordmark-dot { fill:#fff;r:0;animation:kt-blog-wordmark-dot 1s cubic-bezier(.8,0,.2,1) 1.3s forwards; }
      @media (prefers-reduced-motion:reduce) {
        .kt-blog-wordmark-stroke { animation:none;stroke-dashoffset:0;stroke-width:12px;opacity:1; }
        .kt-blog-wordmark-dot { animation:none;r:7.5px; }
      }
    </style>
  </defs>
